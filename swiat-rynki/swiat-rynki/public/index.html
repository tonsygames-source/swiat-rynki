<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Świat → Rynki</title>
  <meta name="description" content="Wiadomości ze świata przełożone na możliwy wpływ na surowce, waluty i akcje.">
  <meta name="theme-color" content="#0b1118">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Świat→Rynki">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" href="/icons/icon-192.png">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="top">
    <div class="top-row">
      <div>
        <h1>Świat <span class="arrow">→</span> Rynki</h1>
        <p id="updated" class="muted small">Ładowanie…</p>
      </div>
      <button id="refresh" class="icon-btn" aria-label="Odśwież dane" title="Odśwież">
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M20 11a8 8 0 1 0-2.3 5.7M20 4v7h-7"/></svg>
      </button>
    </div>
  </header>

  <main>
    <section id="view-overview" class="view" aria-live="polite"></section>
    <section id="view-news" class="view" hidden></section>
    <section id="view-prices" class="view" hidden></section>
  </main>

  <nav class="tabs" aria-label="Główna nawigacja">
    <button data-tab="overview" class="tab active" aria-current="page">
      <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>
      <span>Przegląd</span>
    </button>
    <button data-tab="news" class="tab">
      <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M4 5h16v14H4zM8 9h8M8 13h8M8 17h4"/></svg>
      <span>Wiadomości</span>
    </button>
    <button data-tab="prices" class="tab">
      <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" d="M3 17l6-6 4 4 8-8M15 7h6v6"/></svg>
      <span>Ceny</span>
    </button>
  </nav>

  <script src="/app.js" defer></script>
</body>
</html>
